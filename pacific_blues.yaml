# Based on Pacific Blues by Ritchie Roesch of Fuji X Weekly.
# Source: https://fujixweekly.com/2022/12/06/pacific-blues-fujifilm-x-t5-x-trans-v-film-simulation-recipe/
#
# Tweaks:
# - Exposure 0 to reduce bleaching.
# - Clarity 0 for speed.

name: Pacific Blues
film: ClassicNeg
grain: StrongLarge
color_chrome: Strong
color_chrome_blue: Weak
white_balance: !Temperature 5800
white_balance_red: +1
white_balance_blue: -3
dynamic_range: DR400
dynamic_range_priority: Off
exposure: 0
highlight: -2
shadow: +3
color: +4
sharpness: -2
clarity: 0
high_iso_nr: -4
