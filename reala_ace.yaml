# Based on Reala Ace by Ritchie Roesch of Fuji X Weekly.
# Source: https://fujixweekly.com/2023/09/15/reala-ace-fujifilm-x-t5-x-trans-v-film-simulation-recipe/
#
# Tweaks:
# - Exposure 0 to reduce bleaching.
# - Clarity -2 --> sharpness -2 for speed..

name: Reala Ace
film: ClassicNeg
grain: WeakSmall
color_chrome: Strong
color_chrome_blue: Strong
white_balance: Auto
white_balance_red: -1
white_balance_blue: +1
dynamic_range: DR400
dynamic_range_priority: Off
exposure: 0
highlight: -1.5
shadow: -2
color: +2
sharpness: -2
clarity: 0
high_iso_nr: -4
portrait_enhancer: Off
