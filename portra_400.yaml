# Based on Portra 400 v2 by Ritchie Roesch of Fuji X Weekly.
# Source: https://fujixweekly.com/2022/12/16/kodak-portra-400-v2-fujifilm-x-t5-x-trans-v-film-simulation-recipe/
#
# Tweaks:
# - Exposure 0 to reduce bleaching.
# - Clarity 0 for speed.

name: Portra 400
film: ClassicChrome
grain: StrongSmall
color_chrome: Strong
color_chrome_blue: Off
white_balance: !Temperature 5200
white_balance_red: +1
white_balance_blue: -6
dynamic_range: DR400
dynamic_range_priority: Off
exposure: 0
highlight: 0
shadow: -2
color: +2
sharpness: -2
clarity: 0
high_iso_nr: -4
portrait_enhancer: Off
